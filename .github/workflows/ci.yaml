name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x, 26.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Install Lua for differential tests
      if: matrix.node-version == '24.x'
      run: sudo apt-get update && sudo apt-get install -y lua5.3 lua5.4
    - name: Lint
      run: yarn lint
    - name: Check generated API docs
      run: yarn docs:check
    - name: Typecheck published declarations
      run: yarn typecheck
    - name: Typecheck the checked JavaScript sources
      run: yarn typecheck:js
    - name: Test
      if: matrix.node-version != '24.x'
      run: yarn test --maxWorkers=$(nproc)
      env:
        FENGARICONF: '{"LUAI_MAXSTACK":100000}'
    - name: Coverage
      if: matrix.node-version == '24.x'
      run: yarn test:coverage --maxWorkers=$(nproc)
      env:
        FENGARICONF: '{"LUAI_MAXSTACK":100000}'
    - name: Differential tests against PUC Lua
      if: matrix.node-version == '24.x'
      run: yarn test:diff
    - name: Upload coverage
      if: matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        retention-days: 7
    - name: Validate package tarball
      if: matrix.node-version == '24.x'
      run: |
        npm pack --pack-destination "$RUNNER_TEMP"
        TARBALL=$(ls "$RUNNER_TEMP"/fengari-*.tgz)
        tar -tzf "$TARBALL" | sort > "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/src/fengari.js' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/src/fengari.mjs' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/types/fengari.d.ts' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/dist/fengari.js' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/dist/fengari.min.js' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/dist/fengari.js.map' "$RUNNER_TEMP/tarball.txt"
        grep -qx 'package/package.json' "$RUNNER_TEMP/tarball.txt"
        if grep -q '^package/test/' "$RUNNER_TEMP/tarball.txt"; then
          echo "::error::test/ must not be published"
          exit 1
        fi

  bench:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'yarn'
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Install Lua
      run: sudo apt-get update && sudo apt-get install -y lua5.3 lua5.4
    - name: Benchmarks on Fengari
      run: yarn bench --repeat=1 --warmup=0
    - name: Compare against PUC Lua
      run: yarn bench:compare --repeat=1
    - name: Fuzz the parser and undumper
      run: yarn fuzz --iterations=3000 --seed=2026

  browser:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'yarn'
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Install Brave (optional; falls back to Chrome)
      continue-on-error: true
      run: |
        sudo apt-get update
        sudo apt-get install -y curl
        sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
        sudo apt-get update
        sudo apt-get install -y brave-browser
    - name: Build the browser bundle
      run: yarn build
    - name: Browser integration tests (CDP)
      run: yarn test:browser
